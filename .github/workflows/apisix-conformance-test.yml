name: APISIX Conformance Test

on:
  push:
    branches:
      - master
    # Tag runs produce the report submitted to the Gateway API conformance
    # reports repository, so they must run on the tagged commit itself. The 2.x
    # tags carry no leading v, the 1.x ones did.
    tags:
      - "[0-9]*"
      - "v[0-9]*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write

jobs:
  conformance-test:
    env:
      # The report name encodes the mode, so each provider writes its own file
      # and the two can be submitted side by side. apisix is the controller's
      # default provider, the standalone run declares a named mode.
      CONFORMANCE_MODE: ${{ matrix.conformance_mode }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
        - provider_type: apisix-standalone
          conformance_mode: apisix-standalone
        - provider_type: apisix
          conformance_mode: default
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go Env
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@v0.27.0

      # A tag run must exercise the published image for that release, otherwise
      # the report would describe a local build while claiming the release
      # version. Branch and PR runs keep testing what was just built.
      - name: Build images
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          TAG: dev
          ARCH: amd64
          ENABLE_PROXY: "false"
          BASE_IMAGE_TAG: "debug"
        run: |
          echo "building images..."
          make build-image

      - name: Launch Kind Cluster
        run: |
          make kind-up

      - name: Install And Run Cloud Provider KIND
        run: |
          make kind-lb
  
      - name: Install Gateway API And CRDs
        run: |
          make install

      - name: Loading Docker Image to Kind Cluster
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          make kind-load-adc-image
          make kind-load-ingress-image

      # On a tag the images are pulled from their registries instead, named
      # after the tag being released.
      - name: Resolve Conformance Images
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          # The report declares VERSION, so a tag that does not match it would
          # produce a report describing a release that was never built.
          version="$(make -s print-VERSION)"
          if [ "${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::VERSION is ${version} but the tag is ${GITHUB_REF_NAME}"
            exit 1
          fi
          # git describe cannot see the tag in a shallow checkout, so name it here.
          echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Run Conformance Test
        shell: bash
        continue-on-error: true
        env:
          PROVIDER_TYPE: ${{ matrix.provider_type }}
        run: |
          make conformance-test

      - name: Show Conformance Report
        shell: bash
        run: |
          cat ./*-report.yaml

      # The run above is continue-on-error because the suite still has known
      # gaps, so a failing profile would otherwise go unnoticed. A report that
      # is meant for submission must have every profile at success or partial.
      - name: Check Conformance Report Has No Failing Profile
        shell: bash
        env:
          STRICT: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        run: |
          if grep -qE '^[[:space:]]+result: failure' ./*-report.yaml; then
            echo "::error::conformance report contains a failing profile"
            grep -nE '^[[:space:]]+result:' ./*-report.yaml
            if [ "${STRICT}" = "true" ]; then
              exit 1
            fi
            echo "::warning::not a release run, not failing the job"
          fi

      - name: Get Logs from apisix-ingress-controller
        shell: bash
        run: |
          kubectl logs -n apisix-conformance-test -l app=apisix-ingress-controller

      - name: Upload Gateway API Conformance Report
        uses: actions/upload-artifact@v4
        with:
          # The artifact keeps the upstream report file name, so a release run
          # can be submitted straight from the download without renaming it.
          name: conformance-report-${{ matrix.provider_type }}
          path: ./*-report.yaml
