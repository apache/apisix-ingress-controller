name: APISIX E2E Test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ADC_VERSION: dev
  ADC_RUST_VERSION: "0.30.0"

jobs:
  e2e-test:
    strategy:
      matrix:
        adc_impl:
        - node
        - rust
        provider_type:
        - apisix-standalone
        - apisix
        cases_subset:
        - apisix.apache.org
        - networking.k8s.io
        - webhook
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go Env
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "*"

      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@v0.27.0

      - name: Install ginkgo
        run: |
            make install-ginkgo

      - name: Build images
        env:
          TAG: dev
          ARCH: amd64
          ENABLE_PROXY: "false"
          BASE_IMAGE_TAG: "debug"
        run: |
          echo "building images..."
          make build-image

      - name: Launch Kind Cluster
        run: |
          make kind-up

      - name: Loading Docker Image to Kind Cluster
        run: |
          make kind-load-images

      - name: Install Gateway API And CRDs
        run: |
          make install

      - name: Setup adc (node)
        if: ${{ env.ADC_VERSION == 'dev' && matrix.adc_impl == 'node' }}
        run: |
          docker create --name adc-temp ghcr.io/api7/adc:dev
          # main.cjs lives in the image's WORKDIR, not at the container root,
          # and docker cp resolves a relative SRC_PATH against the root.
          docker cp "adc-temp:$(docker inspect -f '{{.Config.WorkingDir}}' adc-temp)/main.cjs" adc.js
          docker rm adc-temp
          node $(pwd)/adc.js -v
          echo "ADC_BIN=node $(pwd)/adc.js" >> $GITHUB_ENV

      - name: Setup adc (rust)
        if: ${{ matrix.adc_impl == 'rust' }}
        run: |
          curl -fsSL -o adc.tar.gz "https://github.com/api7/adc/releases/download/v${{ env.ADC_RUST_VERSION }}/adc_rust_${{ env.ADC_RUST_VERSION }}_linux_amd64.tar.gz"
          tar -xzf adc.tar.gz adc
          chmod +x adc
          ./adc --version

          # The pod manifest points ADCImage at a real image, unlike ADC_BIN
          # (a bare host path the test scaffold execs directly) — the Rust
          # binary needs to be wrapped in one to stand in as the sidecar.
          cp .github/adc-rust/Dockerfile .github/adc-rust/entrypoint.sh ./
          docker build -t adc-rust:dev -f Dockerfile .
          kind load docker-image adc-rust:dev --name apisix-ingress-cluster

          echo "ADC_BIN=$(pwd)/adc" >> $GITHUB_ENV
          echo "ADC_IMAGE=adc-rust:dev" >> $GITHUB_ENV

      - name: Start OpenLDAP server
        run: make e2e-ldap

      - name: Run E2E test suite
        shell: bash
        env:
          TEST_DIR: "./test/e2e/apisix/"
          PROVIDER_TYPE: ${{ matrix.provider_type }}
          TEST_LABEL: ${{ matrix.cases_subset }}
          TEST_ENV: CI
        run: |
          if [[ "${{ matrix.cases_subset }}" == "webhook" ]]; then
            E2E_NODES=1 make ginkgo-e2e-test
          else
            make ginkgo-e2e-test
          fi

  disable-gateway-api:
    strategy:
      matrix:
        adc_impl:
        - node
        - rust
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go Env
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "*"

      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@v0.27.0

      - name: Install ginkgo
        run: |
            make install-ginkgo

      - name: Build images
        env:
          TAG: dev
          ARCH: amd64
          ENABLE_PROXY: "false"
          BASE_IMAGE_TAG: "debug"
        run: |
          echo "building images..."
          make build-image

      - name: Launch Kind Cluster
        run: |
          make kind-up

      - name: Loading Docker Image to Kind Cluster
        run: |
          make kind-load-images

      - name: Setup adc (node)
        if: ${{ env.ADC_VERSION == 'dev' && matrix.adc_impl == 'node' }}
        run: |
          docker create --name adc-temp ghcr.io/api7/adc:dev
          # main.cjs lives in the image's WORKDIR, not at the container root,
          # and docker cp resolves a relative SRC_PATH against the root.
          docker cp "adc-temp:$(docker inspect -f '{{.Config.WorkingDir}}' adc-temp)/main.cjs" adc.js
          docker rm adc-temp
          node $(pwd)/adc.js -v
          echo "ADC_BIN=node $(pwd)/adc.js" >> $GITHUB_ENV

      - name: Setup adc (rust)
        if: ${{ matrix.adc_impl == 'rust' }}
        run: |
          curl -fsSL -o adc.tar.gz "https://github.com/api7/adc/releases/download/v${{ env.ADC_RUST_VERSION }}/adc_rust_${{ env.ADC_RUST_VERSION }}_linux_amd64.tar.gz"
          tar -xzf adc.tar.gz adc
          chmod +x adc
          ./adc --version

          # The pod manifest points ADCImage at a real image, unlike ADC_BIN
          # (a bare host path the test scaffold execs directly) — the Rust
          # binary needs to be wrapped in one to stand in as the sidecar.
          cp .github/adc-rust/Dockerfile .github/adc-rust/entrypoint.sh ./
          docker build -t adc-rust:dev -f Dockerfile .
          kind load docker-image adc-rust:dev --name apisix-ingress-cluster

          echo "ADC_BIN=$(pwd)/adc" >> $GITHUB_ENV
          echo "ADC_IMAGE=adc-rust:dev" >> $GITHUB_ENV

      - name: Install CRDs
        run: make install-crds

      - name: Run E2E test suite
        shell: bash
        env:
          TEST_DIR: "./test/e2e/apisix/"
          TEST_ENV: CI
          TEST_FOCUS: "Test ApisixRoute Basic tests"
        run: make e2e-test
