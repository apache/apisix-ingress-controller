processor:
  # RE2 regular expressions describing types that should be excluded from the generated documentation.
  ignoreTypes:
    - "List$"
  # RE2 regular expressions describing type fields that should be excluded from the generated documentation.
  ignoreFields:
    - "status$"
    - "TypeMeta$"

render:
  # Version of Kubernetes to use when generating links to Kubernetes API documentation.
  # NOTE: Quotes are required, otherwise the value will be intepreted as a number so versions ending with `0` like 1.30 would be covreted to "1.3" in results.
  kubernetesVersion: "1.30"
  # Link types defined outside the generated API packages to their authoritative references.
  # Without these mappings, crd-ref-docs treats them as local types and emits fragments for
  # headings that are not part of this document.
  knownTypes:
    - name: Group
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://pkg.go.dev/sigs.k8s.io/gateway-api@v1.6.0/apis/v1#Group
    - name: Kind
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://pkg.go.dev/sigs.k8s.io/gateway-api@v1.6.0/apis/v1#Kind
    - name: ObjectName
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://pkg.go.dev/sigs.k8s.io/gateway-api@v1.6.0/apis/v1#ObjectName
    - name: SectionName
      package: sigs.k8s.io/gateway-api/apis/v1
      link: https://pkg.go.dev/sigs.k8s.io/gateway-api@v1.6.0/apis/v1#SectionName
    - name: Duration
      package: time
      link: https://pkg.go.dev/time#Duration
