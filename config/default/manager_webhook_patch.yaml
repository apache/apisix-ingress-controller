# This patch mounts the webhook serving certificate into the manager container.
# The mount path and the port must match the `webhook` section of config.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
      - name: manager
        ports:
        - containerPort: 9443
          name: webhook
          protocol: TCP
        volumeMounts:
        - mountPath: /certs
          name: webhook-certs
          readOnly: true
      volumes:
      - name: webhook-certs
        secret:
          secretName: webhook-server-cert
