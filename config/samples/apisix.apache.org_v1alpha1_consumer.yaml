apiVersion: apisix.apache.org/v1alpha1
kind: Consumer
metadata:
  labels:
    app.kubernetes.io/name: apisix-ingress-controller
    app.kubernetes.io/managed-by: kustomize
  name: consumer-sample
spec:
  gatewayRef:
    name: apisix
  credentials:
    - type: basic-auth
      name: basic-auth-sample
      secretRef:
        name: basic-auth-sample
        namespace: default
    - type: key-auth
      name: key-auth-sample
      config:
        key: sample-key
  plugins:
    - name: key-auth
      config:
        key: sample-key
