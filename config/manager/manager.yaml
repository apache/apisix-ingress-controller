apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: apisix-ingress-controller
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: apisix-ingress-controller
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: apisix-ingress-controller
    spec:
      securityContext:
        # fsGroup lets both containers share the ADC Unix socket.
        fsGroup: 2000
      containers:
      - image: controller:latest
        name: manager
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: ADC_SERVER_URL
          value: unix:/sockets/adc.sock
        ports:
        # Must match metrics_addr in config.yaml.
        - name: metrics
          containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: config-volume
          mountPath: /app/conf/config.yaml
          subPath: config.yaml
        - name: socket-volume
          mountPath: /sockets
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
      - image: sidecar:latest
        name: adc-server
        env:
        - name: ADC_RUNNING_MODE
          value: ingress
        - name: ADC_EXPERIMENTAL_FEATURE_FLAGS
          value: remote-state-file,parallel-backend-request
        - name: ADC_INGRESS_LOG_LEVEL
          value: info
        args:
        - "server"
        - "--listen"
        - "unix:/sockets/adc.sock"
        - "--listen-status"
        - "3001"
        ports:
        - name: http-status
          containerPort: 3001
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz/ready
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: socket-volume
          mountPath: /sockets
      volumes:
      - name: config-volume
        configMap:
          name: controller-config
      - name: socket-volume
        emptyDir: {}
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
