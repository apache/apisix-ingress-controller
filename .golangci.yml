version: "2"
run:
  allow-parallel-runners: true
  # Pin the analysis target Go version: the go.mod directive is 1.26 (required by
  # k8s.io 0.36 / gateway-api 1.6), but the released golangci-lint binary is built
  # with an older Go and refuses to target a newer one.
  go: "1.24"
linters:
  default: none
  enable:
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: comment-spacings
    lll:
      line-length: 160
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      - linters:
          - staticcheck
        text: "ST1001:"
        path: test/.*
      # kubebuilder-generated scaffold: controller-runtime v0.24 deprecated
      # scheme.Builder, but the generated group-version files still rely on it.
      - linters:
          - staticcheck
        text: "SA1019:.*scheme.Builder"
        path: api/.*/groupversion_info.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
